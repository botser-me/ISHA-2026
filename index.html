<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16314F">
<title>ISHA 2026 Bruges – My Programme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#EEF3F8; --surface:#FFFFFF; --ink:#16263D; --ink2:#506179; --ink3:#8594A8;
  --line:#DCE4EE; --sky:#2F6EA8; --sky-soft:#E1ECF7; --night:#16314F;
  --moss:#3D6B4B; --moss-soft:#E3EEE6; --gold:#E3A623; --gold-soft:#FBF0D6; --live:#C2412D;
  --shadow:0 1px 2px rgba(22,38,61,.06),0 6px 18px -10px rgba(22,38,61,.25);
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Helvetica Neue",Arial,system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --canvas:#0D1726; --surface:#15233A; --ink:#E8EEF6; --ink2:#A9B6C8; --ink3:#71819A;
  --line:#24364F; --sky:#7FB3E3; --sky-soft:#1B3150; --night:#0A1422;
  --moss:#8CC59E; --moss-soft:#183326; --gold:#F0B940; --gold-soft:#3A2F14; --live:#FF7A63;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 20px -12px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --canvas:#0D1726; --surface:#15233A; --ink:#E8EEF6; --ink2:#A9B6C8; --ink3:#71819A;
  --line:#24364F; --sky:#7FB3E3; --sky-soft:#1B3150; --night:#0A1422;
  --moss:#8CC59E; --moss-soft:#183326; --gold:#F0B940; --gold-soft:#3A2F14; --live:#FF7A63;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 20px -12px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--sky);outline-offset:2px;border-radius:8px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* Top bar */
.top{background:var(--night);color:#fff;position:relative;overflow:hidden}
.top .wrap{padding-top:14px;padding-bottom:18px;position:relative;z-index:1}
.brand{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.brand h1{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.05;margin:0;letter-spacing:-.01em}
.brand h1 small{display:block;font-family:var(--body);font-weight:500;font-size:13px;opacity:.72;letter-spacing:0;margin-top:4px}
.clock{text-align:right;font-family:var(--display)}
.clock b{display:block;font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.clock span{font-family:var(--body);font-size:12px;opacity:.7}
.skyline{position:absolute;inset:auto 0 0 0;height:46px;opacity:.16;pointer-events:none}

/* Tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);padding:0 6px}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:12px;font-weight:600;color:var(--ink3)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected="true"]{color:var(--sky)}
nav.tabs .count{font-size:10px;background:var(--gold);color:#3A2A00;border-radius:9px;padding:0 5px;margin-left:2px}
main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
section.view{display:none}
section.view.on{display:block}

/* Sticky bars */
.bar{position:sticky;top:0;z-index:20;background:var(--canvas);padding-top:10px;padding-bottom:8px;border-bottom:1px solid transparent}
.bar.stuck{border-bottom-color:var(--line)}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.day{border-radius:12px;padding:7px 4px;text-align:center;background:var(--surface);border:1px solid var(--line)}
.day b{display:block;font-family:var(--display);font-size:20px;line-height:1.05}
.day span{font-size:12px;color:var(--ink2);font-weight:600}
.day[aria-pressed="true"]{background:var(--night);border-color:var(--night);color:#fff}
.day[aria-pressed="true"] span{color:#C8D6E8}
.day .today{display:block;font-size:10px;color:var(--gold);font-weight:700;height:12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--sky);border-color:var(--sky);color:#fff}

/* Timeline list */
.slot{display:grid;grid-template-columns:52px 1fr;gap:10px;margin-top:14px}
.slot-time{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.1;padding-top:12px;font-variant-numeric:tabular-nums;color:var(--ink)}
.slot-time small{display:block;font-family:var(--body);font-size:11px;font-weight:500;color:var(--ink3)}
.slot-cards{display:flex;flex-direction:column;gap:8px;min-width:0}
.card{position:relative;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:12px 44px 12px 14px;text-align:left;width:100%;border-left:4px solid var(--kc,var(--sky));display:block}
.card .meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:12.5px;color:var(--ink2)}
.code{font-weight:700;color:var(--kc,var(--sky));font-size:12px;letter-spacing:.02em}
.card h3{margin:3px 0 4px;font-size:15.5px;line-height:1.3;font-weight:650;font-weight:600}
.card .room{font-size:12.5px;color:var(--ink2)}
.card .who{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12.5px;color:var(--ink2)}
.card .who .faces{display:flex}
.card .who .av{width:28px;height:28px;font-size:10px;letter-spacing:-.03em;margin-left:-6px;border:2px solid var(--surface);font-family:var(--body)}
.card .match{margin-top:7px;font-size:13px;color:var(--ink2);border-left:2px solid var(--gold);padding-left:8px;line-height:1.35}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.card .who .av:first-child{margin-left:0}
.card .note-peek{margin-top:8px;font-size:13px;background:var(--gold-soft);border-radius:8px;padding:6px 9px;color:var(--ink);white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.past{opacity:.55}
.card.brk{padding:9px 14px;box-shadow:none;background:transparent;border:1px dashed var(--line);border-left:4px solid var(--line)}
.card.brk h3{font-size:13.5px;font-weight:500;color:var(--ink2);margin:0}
.star{position:absolute;top:8px;right:6px;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;color:var(--ink3)}
.star svg{width:22px;height:22px}
.star.on{color:var(--gold)}
.star.on svg path{fill:var(--gold)}
.livepill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--live)}
.livepill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.prog{height:4px;border-radius:2px;background:var(--line);margin-top:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--live);border-radius:2px}
.nowline{display:flex;align-items:center;gap:8px;margin:14px 0 0 0;color:var(--live);font-size:12px;font-weight:700}
.nowline::after{content:"";flex:1;height:2px;background:var(--live);border-radius:1px}
.conflict{font-size:11.5px;font-weight:700;color:var(--live)}

/* Kinds */
.k-plenary{--kc:#C2412D}.k-icl{--kc:var(--sky)}.k-symposium{--kc:#7A4FB3}.k-industry{--kc:#8A6A2A}
.k-innovation{--kc:#1E8C86}.k-physio{--kc:var(--moss)}.k-pre{--kc:#4F6D8F}.k-social{--kc:var(--gold)}.k-break{--kc:var(--line)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .k-plenary{--kc:#FF8A72}:root:not([data-theme="light"]) .k-symposium{--kc:#B694E8}:root:not([data-theme="light"]) .k-industry{--kc:#D9B46A}:root:not([data-theme="light"]) .k-innovation{--kc:#5CC9C2}:root:not([data-theme="light"]) .k-pre{--kc:#93AECD}}

/* Now view */
.hero{margin-top:14px}
.hero h2,.sec-h{font-family:var(--display);font-weight:700;font-size:21px;margin:22px 0 2px;letter-spacing:-.01em}
.sec-sub{font-size:13.5px;color:var(--ink2);margin:0 0 6px}
.nowcard{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:14px;margin-top:10px;border-left:4px solid var(--kc,var(--sky));position:relative;text-align:left;width:100%;display:block;padding-right:44px}
.nowcard h3{margin:4px 0 2px;font-size:16.5px;line-height:1.28;font-weight:600}
.talknow{margin-top:10px;background:var(--sky-soft);border-radius:10px;padding:8px 10px;font-size:13.5px}
.talknow b{font-weight:600}
.talknow .tn-l{font-size:11px;font-weight:700;color:var(--sky);display:block;margin-bottom:1px}
.countdown{font-family:var(--display);font-weight:700;color:var(--sky);font-size:14px}
.empty{background:var(--surface);border-radius:16px;padding:22px 18px;margin-top:12px;text-align:center;color:var(--ink2);box-shadow:var(--shadow)}
.empty b{display:block;font-family:var(--display);color:var(--ink);font-size:19px;margin-bottom:4px}
.bignum{font-family:var(--display);font-weight:800;font-size:56px;line-height:1;letter-spacing:-.03em;color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px;background:var(--sky);color:#fff}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.wa{background:#1FA855}
.btn svg{width:18px;height:18px}

/* Search */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:0 12px}
.search:focus-within{border-color:var(--sky)}
.search svg{width:20px;height:20px;color:var(--ink3);flex:0 0 auto}
.search input{flex:1;border:0;background:transparent;padding:12px 0;font-size:16px;outline:none;min-width:0}
.search .clr{color:var(--ink3);font-size:22px;line-height:1;padding:4px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;margin-top:8px}
.seg button{padding:7px 0;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--night);color:#fff}
.tagcloud{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--moss-soft);color:var(--moss)}
.tag[aria-pressed="true"]{background:var(--moss);color:#fff}
.tag small{opacity:.7;font-weight:500;margin-left:3px}
.people{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.person{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:12px;padding:9px 12px;text-align:left;box-shadow:var(--shadow);width:100%}
.person b{display:block;font-weight:600;font-size:14.5px}
.person span{display:block;font-size:12.5px;color:var(--ink2);line-height:1.3}
.person em{margin-left:auto;font-style:normal;font-size:12px;color:var(--ink3);white-space:nowrap}
.av{flex:0 0 auto;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;background:var(--avc,#2F6EA8);font-family:var(--display);letter-spacing:.02em}
.resinfo{font-size:13px;color:var(--ink2);margin:12px 0 0}
.filterhead{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--sky-soft);border-radius:12px;padding:10px 12px;margin-top:10px}
.filterhead b{font-size:14px}
mark{background:var(--gold-soft);color:inherit;border-radius:3px;padding:0 1px}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,34,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:94%;background:var(--canvas);border-radius:20px 20px 0 0;transform:translateY(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;max-width:720px;margin:0 auto}
.sheet.on{transform:none}
.sheet-head{padding:8px 16px 10px;background:var(--surface);border-radius:20px 20px 0 0;border-bottom:1px solid var(--line);border-top:5px solid var(--kc,var(--sky))}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 8px}
.sheet-actions{display:flex;justify-content:space-between;align-items:center}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--canvas)}
.iconbtn svg{width:20px;height:20px}
.iconbtn.on{color:var(--gold)}
.iconbtn.on svg path{fill:var(--gold)}
.sheet-body{overflow-y:auto;padding:4px 16px calc(24px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.sheet h2{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.18;margin:8px 0 6px;letter-spacing:-.01em}
.facts{display:grid;gap:4px;font-size:14px;color:var(--ink2)}
.facts div{display:flex;gap:8px;align-items:flex-start}
.facts svg{width:17px;height:17px;flex:0 0 auto;margin-top:2px;color:var(--ink3)}
.subline{font-size:14px;color:var(--ink2);font-style:italic;margin:4px 0}
.block{background:var(--surface);border-radius:14px;padding:12px 14px;margin-top:12px;box-shadow:var(--shadow)}
.block h4{margin:0 0 8px;font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.block h4 small{font-weight:500;color:var(--ink3)}
textarea.notes{width:100%;min-height:110px;border:1.5px solid var(--line);border-radius:10px;padding:10px;background:var(--canvas);resize:vertical;font-size:15px;line-height:1.45}
textarea.notes:focus{outline:none;border-color:var(--gold)}
.saved{font-size:12px;color:var(--moss);font-weight:600;opacity:0;transition:opacity .3s}
.saved.on{opacity:1}
.talks{list-style:none;margin:0;padding:0}
.talks li{display:grid;grid-template-columns:46px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.talks li:first-child{border-top:0}
.talks .tt{font-family:var(--display);font-weight:700;font-size:13.5px;font-variant-numeric:tabular-nums;color:var(--ink2);line-height:1.2}
.talks .tt small{display:block;font-family:var(--body);font-weight:500;font-size:11px;color:var(--ink3)}
.talks .tn{font-size:14px;line-height:1.35}
.talks .tp{font-size:12.5px;color:var(--ink2);margin-top:2px}
.talks .tp button{color:var(--sky);font-weight:600;font-size:12.5px}
.talks li.now{background:var(--sky-soft);margin:0 -14px;padding:9px 14px;border-radius:8px}
.talks li.now .tt{color:var(--live)}
.spk{display:flex;flex-direction:column}
.spk .person{box-shadow:none;padding:8px 0;border-radius:0;border-top:1px solid var(--line);background:transparent}
.spk .person:first-child{border-top:0}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--night);color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.legend{display:flex;flex-wrap:wrap;gap:10px 14px;font-size:12px;color:var(--ink2);margin-top:20px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--kc);margin-right:5px;vertical-align:-1px}
.foot{font-size:12px;color:var(--ink3);margin:22px 0 8px;text-align:center}
.agenda-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (min-width:640px){.card h3{font-size:16px}.slot{grid-template-columns:64px 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <svg class="skyline" viewBox="0 0 400 46" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><path fill="#fff" d="M0 46V30h14l6-8 6 8h10V18l4-6 4 6v12h12l8-10 8 10h8V8l3-8 3 8v22h14l5-6 5 6h12V20h6l3-6 3 6h6v10h10l7-9 7 9h10V24l5-5 5 5v6h16l6-8 6 8h8V14l4-5 4 5v16h12l8-10 8 10h12V22h10v8h14l5-7 5 7h10V26l6-6 6 6v4h12l6-8 6 8h12V18l3-6 3 6v12h14v16z"/></svg>
  <div class="wrap">
    <div class="brand">
      <h1>ISHA 2026<small>Annual Scientific Meeting, Bruges</small></h1>
      <div class="clock"><b id="clk">--:--</b><span id="clkd">Bruges time</span></div>
    </div>
  </div>
</header>

<main>
  <section class="view on" id="v-now" aria-label="Happening now"><div class="wrap" id="now"></div></section>

  <section class="view" id="v-prog" aria-label="Programme">
    <div class="bar"><div class="wrap">
      <div class="days" id="days"></div>
      <div class="chips" id="kinds"></div>
    </div></div>
    <div class="wrap" id="prog"></div>
  </section>

  <section class="view" id="v-search" aria-label="Search">
    <div class="bar"><div class="wrap">
      <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span class="sr">Search the programme</span>
        <input id="q" type="search" placeholder="Search titles, tags, speakers…" autocomplete="off" enterkeyhint="search">
        <button class="clr" id="qclr" aria-label="Clear search" hidden>×</button></label>
      <div class="seg" id="scope" role="group" aria-label="Search in"></div>
    </div></div>
    <div class="wrap" id="res"></div>
  </section>

  <section class="view" id="v-mine" aria-label="My agenda"><div class="wrap" id="mine"></div></section>
</main>

<nav class="tabs" aria-label="Main"><div class="wrap" role="tablist">
  <button role="tab" data-v="now" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Now</button>
  <button role="tab" data-v="prog" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Programme</button>
  <button role="tab" data-v="search" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Search</button>
  <button role="tab" data-v="mine" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3.5 2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.8z"/></svg><span>My agenda<span class="count" id="favn" hidden></span></span></button>
</div></nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title">
  <div class="sheet-head" id="shhead">
    <div class="grab"></div>
    <div class="sheet-actions">

const fmtParts = new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Brussels',year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hourCycle:'h23',weekday:'short'});
function nowInfo(){
  const o = {}; fmtParts.formatToParts(new Date()).forEach(p => o[p.type] = p.value);
  const y = +o.year, mo = +o.month, d = +o.day, h = +o.hour, mi = +o.minute;

function hl(text, terms){ let h = esc(text); if (!terms || !terms.length) return h;
  terms.forEach(t => { if (t.length < 2) return; const re = new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'); h = h.replace(re, '<mark>$1</mark>'); }); return h; }
function currentTalk(s){ return s.tk.find(t => NOW.k >= t.a && NOW.k < t.b && t.p.length) || s.tk.find(t => NOW.k >= t.a && NOW.k < t.b); }
function conflicts(){ const favs = S.filter(s => ST.fav[s.id] && s.k!=='break').sort((a,b)=>a.a-b.a); const c = {};
  for (let i=0;i<favs.length;i++) for (let j=i+1;j<favs.length;j++){ if (favs[j].a >= favs[i].b) break; c[favs[i].id]=1; c[favs[j].id]=1; } return c; }

function card(s, opt={}){
  if (s.k === 'break') return `<div class="card brk k-break${NOW.k>=s.b?' past':''}"><h3>${esc(s.t)}</h3><div class="room">${esc(s.s)}–${esc(s.e)}${s.r ? ' &nbsp; '+esc(roomShort(s.r)) : ''}</div></div>`;
  const live = NOW.k >= s.a && NOW.k < s.b, past = NOW.k >= s.b;
  const names = s.sp.map(k => P[k]?.n).filter(Boolean);
  const faces = names.slice(0,4).map(n => av(n)).join('');
  const whoTxt = names.length ? esc(names.slice(0,2).map(shortName).join(', ')) + (names.length>2 ? ` +${names.length-2}` : '') : '';
  const fav = !!ST.fav[s.id]; const note = ST.notes[s.id];
  const tt = opt.terms ? hl(s.title, opt.terms) : esc(s.title);
  return `<div class="card k-${s.k}${past && !opt.keep ?' past':''}" role="button" tabindex="0" data-open="${s.id}">
    <div class="meta">${s.c ? `<span class="code">${esc(s.c)}</span>` : `<span class="code">${esc(KLABEL[s.k]||'')}</span>`}
      <span>${opt.day ? esc(dayLabel(s.d))+', ' : ''}${esc(s.s)}–${esc(s.e)}</span>${live ? '<span class="livepill">Live</span>' : ''}${opt.conf && opt.conf[s.id] ? '<span class="conflict">Overlaps</span>' : ''}</div>
    <h3>${tt}</h3>
    ${s.r ? `<div class="room">${esc(roomShort(s.r))}</div>` : ''}
    ${names.length ? `<div class="who"><span class="faces">${faces}</span><span>${whoTxt}</span></div>` : ''}
    ${live ? `<div class="prog"><i style="width:${Math.round((NOW.k-s.a)/(s.b-s.a)*100)}%"></i></div>` : ''}
    ${opt.terms && opt.terms.length ? (() => { const ft = fold(s.title); if (opt.terms.every(x => ft.includes(x))) return ''; const t = s.tk.find(t => opt.terms.every(x => fold(t.t).includes(x))) || s.tk.find(t => opt.terms.some(x => fold(t.t).includes(x))); return t ? `<div class="match">${esc(t.s)}&nbsp; ${hl(t.t, opt.terms)}</div>` : ''; })() : ''}
    ${note && opt.peek !== false ? `<div class="note-peek">${esc(note)}</div>` : ''}
    <button class="star${fav?' on':''}" data-star="${s.id}" aria-label="${fav?'Remove from':'Add to'} my agenda" aria-pressed="${fav}">${star(fav)}</button>
  </div>`;
}
function slots(list, opt={}){
  const g = []; let cur;
  list.forEach(s => { if (!cur || cur.s !== s.s || cur.d !== s.d) { cur = {s:s.s, d:s.d, a:s.a, items:[]}; g.push(cur); } cur.items.push(s); });
  let html = '', nowDrawn = false;
  g.forEach(x => {
    if (opt.nowline && !nowDrawn && NOW.k > -Infinity && NOW.k < x.a && x.d === Math.floor(NOW.k/1440)) { html += `<div class="nowline">Now ${NOW.hm}</div>`; nowDrawn = true; }
    const ap = +x.s.slice(0,2) >= 12 ? 'pm' : 'am';
    html += `<div class="slot"><div class="slot-time">${esc(x.s)}${opt.day ? `<small>${esc(DAYS.find(z=>z.d===x.d)?.w||'')} ${x.d}</small>` : ''}</div><div class="slot-cards">${x.items.map(s => card(s,opt)).join('')}</div></div>`;
  });
  return html;
}

/* ---------- NOW view ---------- */
function renderNow(){
  const el = $('#now'); const k = NOW.k;
  const real = S.filter(s => s.k !== 'break');
  let h = '';
  if (k === -Infinity || k < S[0].a - 0) {
    const first = S.filter(s => s.a === Math.min(...S.map(z=>z.a)));
    const mins = k === -Infinity ? null : S[0].a - k;
    h += `<div class="hero"><h2>Not started yet</h2><p class="sec-sub">The meeting opens ${esc(dayLabel(S[0].d))} at ${esc(S[0].s)} in Bruges.</p></div>`;
    if (mins !== null) h += `<div class="empty"><div class="bignum">${mins >= 1440 ? Math.ceil(mins/1440)+' days' : rel(mins).replace('in ','')}</div>until the first session</div>`;
    h += `<h3 class="sec-h">First up</h3>` + first.map(s => nowCard(s, true)).join('');
    el.innerHTML = h + legend(); return;
  }
  if (k >= Math.max(...S.map(s=>s.b))) {
    el.innerHTML = `<div class="empty" style="margin-top:18px"><b>That's a wrap</b>ISHA 2026 has finished. Your starred sessions and notes are still in My agenda.<div style="margin-top:12px"><button class="btn" data-goto="mine">Open my agenda</button></div></div>`; return;
  }
  const live = real.filter(s => k >= s.a && k < s.b && s.k !== 'social' || (s.k==='social' && k>=s.a && k<s.b));
  const brk = S.filter(s => s.k === 'break' && k >= s.a && k < s.b);
  const upcoming = real.filter(s => s.a > k).sort((a,b)=>a.a-b.a);
  const nextStarts = [...new Set(upcoming.map(s=>s.a))].slice(0,3);
  const next = upcoming.filter(s => nextStarts.includes(s.a) && s.a - k <= 18*60);
  h += `<div class="hero"><h2>Happening now</h2><p class="sec-sub">${esc(NOW.wd)} ${NOW.d} Oct, ${NOW.hm} in Bruges${brk.length ? ` &nbsp; ${esc(brk[0].t.split(',')[0])} until ${esc(brk[0].e)}` : ''}</p></div>`;
  h += live.length ? live.sort((a,b)=> (ST.fav[b.id]?1:0)-(ST.fav[a.id]?1:0) || a.a-b.a).map(s => nowCard(s)).join('') : `<div class="empty"><b>Nothing on stage right now</b>${next.length ? 'Next sessions are below.' : 'Check the programme for later days.'}</div>`;
  if (next.length) {
    h += `<h3 class="sec-h">Up next</h3><p class="sec-sub">Starred sessions are listed first.</p>`;
    nextStarts.forEach(a => {
      const grp = next.filter(s => s.a === a).sort((x,y)=>(ST.fav[y.id]?1:0)-(ST.fav[x.id]?1:0));
      if (!grp.length) return;
      h += `<div class="slot"><div class="slot-time">${esc(grp[0].s)}<small class="countdown">${esc(rel(a-k))}</small></div><div class="slot-cards">${grp.map(s=>card(s,{peek:true})).join('')}</div></div>`;
    });
  }
  el.innerHTML = h + legend();
}
function nowCard(s, upcoming){
  const t = upcoming ? null : currentTalk(s); const fav = !!ST.fav[s.id];
  const pct = upcoming ? 0 : Math.round((NOW.k - s.a)/(s.b - s.a)*100);
  const tSpk = t && t.p.length ? t.p.map(p=>p[0]).join(', ') : '';
  return `<div class="nowcard k-${s.k}" role="button" tabindex="0" data-open="${s.id}">
    <div class="card-meta meta">${s.c ? `<span class="code">${esc(s.c)}</span>` : `<span class="code">${esc(KLABEL[s.k]||'')}</span>`}<span>${esc(s.s)}–${esc(s.e)}</span>${upcoming ? '' : `<span class="livepill">Live, ends ${esc(s.e)}</span>`}</div>
    <h3>${esc(s.title)}</h3><div class="room" style="font-size:13px;color:var(--ink2)">${esc(roomShort(s.r))}</div>
    ${t ? `<div class="talknow"><span class="tn-l">On now, ${esc(t.s)}–${esc(t.e)}</span><b>${esc(t.t)}</b>${tSpk ? `<div style="color:var(--ink2);font-size:12.5px;margin-top:2px">${esc(tSpk)}</div>` : ''}</div>` : ''}
    ${upcoming ? '' : `<div class="prog"><i style="width:${pct}%"></i></div>`}
    ${ST.notes[s.id] ? `<div class="note-peek" style="margin-top:8px;font-size:13px;background:var(--gold-soft);border-radius:8px;padding:6px 9px">${esc(ST.notes[s.id])}</div>` : ''}
    <button class="star${fav?' on':''}" data-star="${s.id}" aria-label="${fav?'Remove from':'Add to'} my agenda" aria-pressed="${fav}">${star(fav)}</button></div>`;
}
function legend(){ return `<div class="legend">${KINDS.slice(1).map(([k,l])=>`<span class="k-${k}"><i></i>${l}</span>`).join('')}</div><p class="foot">All times are Bruges local time (CEST). Programme subject to change.</p>`; }

/* ---------- PROGRAMME view ---------- */

/* ---------- SEARCH view ---------- */
let scope = 'all', selTag = null, selPerson = null;
const SCOPES = [['all','All'],['t','Title'],['g','Tags'],['p','Speakers']];
const TAGS = (() => { const c = {}; S.forEach(s => s.g.forEach(t => c[t] = (c[t]||0)+1)); return Object.entries(c).sort((a,b)=>a[0].localeCompare(b[0])); })();
function renderScope(){ $('#scope').innerHTML = SCOPES.map(([k,l]) => `<button data-scope="${k}" aria-pressed="${k===scope}">${l}</button>`).join(''); }
function renderSearch(){
  renderScope();
  const qv = $('#q').value.trim(); $('#qclr').hidden = !qv;
  const terms = fold(qv).split(/\s+/).filter(Boolean);
  const el = $('#res'); let h = '';
  if (selPerson) {
    const p = P[selPerson]; const ids = PS[selPerson] || [];
    h += `<div class="filterhead"><div style="display:flex;gap:10px;align-items:center">${av(p.n)}<div><b>${esc(p.n)}</b>${p.a ? `<div style="font-size:12.5px;color:var(--ink2)">${esc(p.a)}</div>` : ''}</div></div><button class="btn ghost" data-clearp>Clear</button></div>`;
    h += `<p class="resinfo">${ids.length} session${ids.length===1?'':'s'}</p>` + slots(ids.map(i=>BYID[i]).sort((a,b)=>a.a-b.a), {day:true, keep:true});
    el.innerHTML = h; return;
  }
  if (selTag) h += `<div class="filterhead"><b>Tag: ${esc(selTag)}</b><button class="btn ghost" data-cleart>Clear</button></div>`;
  if (!terms.length && !selTag) {
    if (scope === 'p') { h += peopleList(Object.keys(P), []); el.innerHTML = h; return; }
    h += `<h3 class="sec-h" style="font-size:18px">Browse by tag</h3><div class="tagcloud">${TAGS.map(([t,n]) => `<button class="tag" data-tag="${esc(t)}">${esc(t)}<small>${n}</small></button>`).join('')}</div>`;
    h += `<p class="resinfo">Type any word: a topic, a technique, a room or a surgeon's name. Results cover all four days.</p>`;
    el.innerHTML = h; return;
  }
  let list = S.filter(s => s.k !== 'break');
  if (selTag) list = list.filter(s => s.g.includes(selTag));
  if (terms.length) {
    const f = scope==='all' ? 'all' : scope;
    list = list.filter(s => terms.every(t => s.hay[f].includes(t)));
  }
  // speaker matches
  if (terms.length && (scope==='all' || scope==='p')) {
    const ppl = Object.keys(P).filter(k => { const hs = fold(P[k].n + ' ' + P[k].a); return terms.every(t => hs.includes(t)); });
    if (ppl.length) h += `<h3 class="sec-h" style="font-size:18px">Speakers <small style="font-size:13px;color:var(--ink3);font-weight:500">${ppl.length}</small></h3>` + peopleList(ppl.slice(0, scope==='p'?80:6), terms) + (scope!=='p' && ppl.length>6 ? `<button class="btn ghost" style="margin-top:8px;width:100%" data-scope="p">Show all ${ppl.length} speakers</button>` : '');
  }
  if (scope === 'g' && terms.length && !selTag) {
    const tg = TAGS.filter(([t]) => terms.every(x => fold(t).includes(x)));
    if (tg.length) h += `<div class="tagcloud">${tg.map(([t,n]) => `<button class="tag" data-tag="${esc(t)}">${esc(t)}<small>${n}</small></button>`).join('')}</div>`;
  }
  h += `<h3 class="sec-h" style="font-size:18px">Sessions <small style="font-size:13px;color:var(--ink3);font-weight:500">${list.length}</small></h3>`;
  h += list.length ? slots(list, {day:true, keep:true, terms}) : `<div class="empty"><b>No sessions match</b>Check the spelling or switch the filter to All.</div>`;
  el.innerHTML = h;
}
function peopleList(keys, terms){
  keys = keys.slice().sort((a,b)=> (P[a].n.split(' ').pop()).localeCompare(P[b].n.split(' ').pop()));
  return `<div class="people">${keys.map(k => `<button class="person" data-person="${esc(k)}">${av(P[k].n)}<div><b>${hl(P[k].n,terms)}</b>${P[k].a ? `<span>${hl(P[k].a,terms)}</span>` : ''}</div><em>${(PS[k]||[]).length} sess.</em></button>`).join('')}</div>`;
}

/* ---------- MY AGENDA ---------- */
function renderMine(){
  const favs = S.filter(s => ST.fav[s.id]).sort((a,b)=>a.a-b.a);
  const noted = S.filter(s => ST.notes[s.id] && !ST.fav[s.id]).sort((a,b)=>a.a-b.a);
  const n = favs.length; const b = $('#favn'); b.hidden = !n; b.textContent = n;
  let h = `<div class="hero"><h2>My agenda</h2><p class="sec-sub">Starred sessions and your notes, saved on this phone.</p></div>`;
  if (!favs.length && !noted.length) {
    $('#mine').innerHTML = h + `<div class="empty"><b>Nothing starred yet</b>Tap the star on any session to build your day. Notes you write appear here too.<div style="margin-top:12px"><button class="btn" data-goto="prog">Browse the programme</button></div></div>`; return;
  }
  h += `<div class="agenda-actions"><button class="btn wa" data-share><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.4-3c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .2-1.2c-.1-.1-.3-.2-.5-.3z"/></svg>Send to WhatsApp</button><button class="btn ghost" data-copy>Copy as text</button></div>`;
  const conf = conflicts();
  if (favs.length) DAYS.forEach(x => { const l = favs.filter(s => s.d===x.d); if (l.length) h += `<h3 class="sec-h" style="font-size:18px">${esc(dayLabel(x.d))}</h3>` + slots(l, {conf, keep:true}); });
  if (noted.length) h += `<h3 class="sec-h" style="font-size:18px">Notes on other sessions</h3>` + slots(noted, {day:true, keep:true});
  $('#mine').innerHTML = h + `<p class="foot">Saved in this browser only. Use “Copy as text” to keep a backup.</p>`;
}
function agendaText(){
  const favs = S.filter(s => ST.fav[s.id] || ST.notes[s.id]).sort((a,b)=>a.a-b.a);
  let out = '*My ISHA 2026 agenda (Bruges)*\n'; let d = 0;
  favs.forEach(s => { if (s.d !== d) { d = s.d; out += `\n*${dayLabel(d)}*\n`; }
    out += `${ST.fav[s.id]?'⭐':'📝'} ${s.s}–${s.e}  ${s.c ? s.c+' ' : ''}${s.title}\n   ${roomShort(s.r)}\n`;
    if (ST.notes[s.id]) out += `   Note: ${ST.notes[s.id].replace(/\n/g,'\n   ')}\n`; });
  return out;
}

  }
  if (ppl.length) h += `<div class="block"><h4>Faculty <small>${ppl.length}</small></h4><div class="spk">${ppl.map(k => `<button class="person" data-person="${esc(k)}" data-close>${av(P[k].n)}<div><b>${esc(P[k].n)}</b>${P[k].a ? `<span>${esc(P[k].a)}</span>` : ''}</div><em>${(PS[k]||[]).length > 1 ? (PS[k].length)+' sess.' : ''}</em></button>`).join('')}</div></div>`;

function closeSheet(){
  if (!openId) return;

  openId = null; $('#scrim').classList.remove('on'); $('#sheet').classList.remove('on'); document.body.style.overflow = '';
  renderAll();
}
function syncSheetStar(){ const on = !!ST.fav[openId]; const b = $('#shstar'); b.classList.toggle('on', on); b.setAttribute('aria-label', on ? 'Remove from my agenda' : 'Add to my agenda'); b.setAttribute('aria-pressed', on); }
function toggleFav(id){ if (ST.fav[id]) { delete ST.fav[id]; toast('Removed from my agenda'); } else { ST.fav[id] = 1; toast('Added to my agenda'); } save(); }

/* ---------- routing ---------- */
let view = 'now';
function go(v){ view = v; document.querySelectorAll('section.view').forEach(x => x.classList.toggle('on', x.id === 'v-'+v));
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.v === v));
  renderAll(); window.scrollTo(0,0); }
function renderAll(){ NOW = nowInfo(); $('#clk').textContent = NOW.hm; $('#clkd').textContent = `${NOW.wd} ${NOW.d}/${NOW.mo}, Bruges`;
  if (view==='now') renderNow(); else if (view==='prog') renderProg(); else if (view==='search') renderSearch(); renderMine(); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-star],[data-open],[data-day],[data-kind],[data-scope],[data-tag],[data-person],[data-clearp],[data-cleart],[data-goto],[data-share],[data-copy],nav.tabs button');
  if (!t) return;
  if (t.dataset.star) { e.stopPropagation(); toggleFav(t.dataset.star); renderAll(); return; }
  if (t.matches('nav.tabs button')) { go(t.dataset.v); return; }
  if (t.dataset.open) { openSheet(t.dataset.open); return; }
  if (t.dataset.day) { curDay = +t.dataset.day; curKind = 'all'; renderProg(); window.scrollTo(0,0); return; }
  if (t.dataset.kind) { curKind = t.dataset.kind; renderProg(); return; }
  if (t.dataset.scope) { scope = t.dataset.scope; selPerson = null; renderSearch(); return; }
  if (t.dataset.tag) { if (t.hasAttribute('data-close')) closeSheet(); selTag = selTag===t.dataset.tag && !t.hasAttribute('data-close') ? null : t.dataset.tag; selPerson = null; $('#q').value=''; if (view!=='search') go('search'); else renderSearch(); window.scrollTo(0,0); return; }
  if (t.dataset.person) { if (t.hasAttribute('data-close')) closeSheet(); selPerson = t.dataset.person; if (view!=='search') go('search'); else renderSearch(); window.scrollTo(0,0); return; }
  if (t.hasAttribute('data-clearp')) { selPerson = null; renderSearch(); return; }
  if (t.hasAttribute('data-cleart')) { selTag = null; renderSearch(); return; }
  if (t.dataset.goto) { go(t.dataset.goto); return; }
  if (t.hasAttribute('data-share')) { window.open('https://wa.me/?text=' + encodeURIComponent(agendaText()), '_blank', 'noopener'); return; }
  if (t.hasAttribute('data-copy')) { const txt = agendaText(); (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(()=>toast('Agenda copied'), ()=>{ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); toast('Agenda copied');}catch(_){} ta.remove(); }); return; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSheet();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-open]')) { e.preventDefault(); openSheet(e.target.dataset.open); }
});
$('#scrim').addEventListener('click', closeSheet);
$('#shclose').addEventListener('click', closeSheet);
$('#shstar').addEventListener('click', () => { toggleFav(openId); syncSheetStar(); });
$('#q').addEventListener('input', () => { selPerson = null; renderSearch(); });
$('#qclr').addEventListener('click', () => { $('#q').value=''; selTag = null; renderSearch(); $('#q').focus(); });
// swipe down to close sheet
(() => { let y0 = null; const sh = $('#shhead');
  sh.addEventListener('touchstart', e => y0 = e.touches[0].clientY, {passive:true});
  sh.addEventListener('touchend', e => { if (y0 !== null && e.changedTouches[0].clientY - y0 > 60) closeSheet(); y0 = null; }); })();
// sticky bar shadow
window.addEventListener('scroll', () => document.querySelectorAll('.bar').forEach(b => b.classList.toggle('stuck', window.scrollY > 10)), {passive:true});
// tick every 30s
setInterval(() => { if (!openId && document.activeElement?.id !== 'q') renderAll(); else { NOW = nowInfo(); $('#clk').textContent = NOW.hm; } }, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !openId) renderAll(); });
renderAll();
})();
</script>
</body>
</html>
